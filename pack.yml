# Pack pipeline: rebuilds the store artifact from a clean agent and reruns
# every verification gate against both the built tree and the UNPACKED zip
# (the packaging gate from the build plan), then publishes the zip as a
# pipeline artifact. Runs on every main merge for continuous provenance; a
# manual run with createReleaseTag creates the release/<manifest version>
# tag, which the mirror carries to GitHub where the release workflow
# (.github/workflows/release.yml) publishes the release with the artifact
# attached. Tags are lightweight on purpose: they carry no tagger identity
# into the public mirror.
#
# Versioning is a normal pull request that bumps src/manifest.json and
# package.json together; this pipeline refuses to tag a version twice.

trigger:
  branches:
    include:
    - main

parameters:
  - name: createReleaseTag
    displayName: "Create the release/<manifest version> tag (publishes the GitHub release)"
    type: boolean
    default: false

stages:
- stage: pack
  jobs:
    - job: verify_and_pack
      pool: standard-nanos
      workspace:
        clean: all
      steps:
        - checkout: self
          persistCredentials: true

        - task: UseNode@1
          inputs:
            version: "24.x"
          displayName: node 24

        - task: npmAuthenticate@0
          inputs:
            workingFile: .npmrc
          displayName: feed auth

        - script: npm install
          displayName: install

        - script: npm test
          displayName: unit suite and coverage gates

        - script: npm run build
          displayName: build dist

        - script: |
            set -euo pipefail
            bash scripts/audit-remote-code.sh dist
            bash scripts/verify-manifest.sh dist/manifest.json
          displayName: audit the built tree

        - script: npm run package
          displayName: pack the store artifact

        - script: |
            set -euo pipefail
            ver="$(node -p "require('./src/manifest.json').version")"
            unzip -q "build/lectern-${ver}.zip" -d build/unpacked
            bash scripts/audit-remote-code.sh build/unpacked
            bash scripts/verify-manifest.sh build/unpacked/manifest.json
            echo "##vso[build.updatebuildnumber]${ver}+$(Build.SourceVersion)"
          displayName: audit the unpacked store artifact

        - publish: build
          artifact: store-artifact
          displayName: publish the zip artifact

        - ${{ if eq(parameters.createReleaseTag, true) }}:
          - script: |
              set -euo pipefail
              ver="$(node -p "require('./src/manifest.json').version")"
              if git ls-remote --tags origin "release/${ver}" | grep -q .; then
                echo "release/${ver} already exists; bump the manifest version first"
                exit 1
              fi
              git tag "release/${ver}"
              git push origin "release/${ver}"
            displayName: create the release tag
