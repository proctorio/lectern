<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select Languages</title>
  <link rel="stylesheet" type="text/css" href="css/base.css">
  <link rel="stylesheet" type="text/css" href="css/common.css">
  <style>
  h1 {
    margin-top: var(--space-16);
    margin-bottom: var(--space-16);
  }
  /* Per-language voice pickers render as cards on the base surface; the
     token pairs in common.css carry the dark theme. */
  .voice-list {
    display: inline-block;
    margin: var(--space-4) 0 var(--space-12) var(--space-16);
    padding: var(--space-8) var(--space-16);
    background-color: var(--background-surface-secondary);
    border: 1px solid var(--border-secondary);
    border-radius: var(--border-radius-default);
    box-shadow: var(--shadow-sm);
    white-space: nowrap;
  }
  .voice-list input[type=radio] {
    margin-right: var(--space-6);
    accent-color: var(--background-success-default);
  }
  </style>

  <script type="module" src="js/languages.js"></script>
</head>
<body>
  <main class="container">
    <h1 data-i18n="languages_heading"></h1>
    <form>
      <div class="form-group" id="lang-list">
      </div>
    </form>
  </main>
</body>
</html>
