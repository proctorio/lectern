<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select Languages</title>
  <link rel="stylesheet" type="text/css" href="css/base.css">
  <link rel="stylesheet" type="text/css" href="css/common.css">
  <style>
  /* The page heading is an h1 for document structure; it keeps the 2rem
     size the bootstrap h2 had so the page looks unchanged. */
  h1 {
    font-size: 2rem;
    margin-top: 15px;
    margin-bottom: 20px;
  }
  .voice-list {
    display: inline-block;
    margin: .2em 0 .8em 1em;
    padding: .5em 1em;
    background-color: #f6f6f6;
    color: #454545;
    border: 1px solid #c5c5c5;
    border-radius: 5px;
    white-space: nowrap;
  }
  .voice-list input[type=radio] {
    margin-right: .4em;
  }
  .dark-mode .voice-list {
    background-color: #333;
    border: none;
    box-shadow: 1px 1px black;
    color: #ddd;
  }
  </style>

  <script src="js/vendor/jquery-3.7.1.min.js"></script>
  <script type="module" src="js/languages.js"></script>
</head>
<body>
  <main class="container">
    <h1 data-i18n="languages_heading"></h1>
    <form>
      <div class="form-group" id="lang-list">
      </div>
    </form>
  </main>
</body>
</html>
