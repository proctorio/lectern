<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lectern Advanced Options</title>
  <link rel="stylesheet" type="text/css" href="css/common.css">
  <link rel="stylesheet" type="text/css" href="css/options.css">

  <script src="js/vendor/jquery-3.7.1.min.js"></script>
  <script type="module" src="js/advanced-options.js"></script>
</head>
<body>
  <main class="container-fluid">
    <button type="button" class="close" data-i18n-label="options_close_label">
      <span aria-hidden="true">&times;</span>
    </button>

    <h1>Advanced Options</h1>

    <div id="advanced-options">
      <input type="checkbox" id="fix-bt-silence-gap"
      ><label for="fix-bt-silence-gap">Fix missing first few words of each paragraph when using Bluetooth headset</label>
    </div>
  </main>
</body>
</html>
